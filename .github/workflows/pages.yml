name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - styles.css
      - app.js
      - .site/logo
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Stage static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html styles.css app.js .nojekyll _site/

          python3 - <<'PY'
          import os
          from pathlib import Path

          logo = Path('.site/logo').read_text(encoding='utf-8').strip()
          prefix = 'data:image/png;base64,'
          if not logo.startswith(prefix):
              raise SystemExit(f'.site/logo must start with {prefix!r}')

          payload = logo[len(prefix):]
          if not payload or len(payload) % 4:
              raise SystemExit('invalid base64 payload length in .site/logo')

          sha = os.environ['GITHUB_SHA']
          html_path = Path('_site/index.html')
          html = html_path.read_text(encoding='utf-8')
          target = '<div class="logo-frame"></div>'
          replacement = f'<div class="logo-frame"><img src="{logo}" alt="dashxd logo"></div>'
          if target not in html:
              raise SystemExit('logo frame not found in index.html')
          html = html.replace(target, replacement, 1)
          html = html.replace('styles.css', f'styles.css?v={sha}', 1)
          html = html.replace('app.js', f'app.js?v={sha}', 1)
          html_path.write_text(html, encoding='utf-8')
          PY

          grep -q 'src="data:image/png;base64,' _site/index.html
          test "$(wc -c < _site/index.html)" -gt 465000

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
