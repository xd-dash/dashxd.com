<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>dashxd.com</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-site="dashxd.com">
  <main class="page-shell">
    <header class="brand">
      <div class="logo-frame"></div>
    </header>

    <section class="menu-shell" aria-label="dash xd menu">
      <button
        class="link-button console-toggle"
        type="button"
        data-console-toggle
        aria-expanded="false"
        aria-controls="console-panel"
      >&gt;_</button>

      <nav class="link-stack" aria-label="Primary links" data-primary-links>
        <a class="link-button" href="#" data-outbound-target="console.dash.xd.run">console.dash.xd.run</a>
        <a class="link-button" href="#" data-outbound-target="logma.sh">logma.sh</a>
        <a class="link-button" href="#" data-outbound-target="chi.ninja">chi.ninja</a>
        <a class="link-button" href="#" data-outbound-target="gospace.cloud">gospace.cloud</a>
        <a class="link-button" href="#" data-outbound-target="gateway.us-west1.farcaster.world">gateway.us-west1.farcaster.world</a>
        <a class="link-button" href="#" data-outbound-target="deploy.fatline.to">deploy.fatline.to</a>
        <a class="link-button" href="#" data-outbound-target="firekv.com">firekv.com</a>
        <a class="link-button" href="#" data-outbound-target="oidc.auth.net.im">oidc.auth.net.im</a>
      </nav>

      <section class="console-panel" id="console-panel" data-console-panel hidden aria-label="dash xd console">
        <div
          class="chat-transcript"
          data-chat-transcript
          role="log"
          aria-live="polite"
          aria-relevant="additions"
          aria-label="conversation"
        ></div>

        <form class="chat-composer-shell" data-chat-form>
          <label class="composer-label" for="chat-composer">message dash xd</label>
          <textarea
            class="chat-composer"
            id="chat-composer"
            data-chat-composer
            rows="3"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder=">_"
          ></textarea>
        </form>
      </section>
    </section>

    <footer class="site-footer">
      <div class="footer-links">
        <a href="https://github.com/dash-xd" target="_blank" rel="noopener noreferrer">github.com/dash-xd</a>
        <span class="git-mark" aria-label="git" title="Git">
          <svg viewBox="0 0 24 24" role="img" aria-hidden="true">
            <path d="M23.546 10.93 13.067.452a1.55 1.55 0 0 0-2.19 0L8.708 2.621l2.76 2.76a1.838 1.838 0 0 1 2.327 2.341l2.66 2.66a1.838 1.838 0 1 1-1.102 1.036l-2.482-2.482v6.529a1.84 1.84 0 1 1-1.512-.053V8.822a1.84 1.84 0 0 1-.999-2.413L7.64 3.69.452 10.878a1.55 1.55 0 0 0 0 2.19l10.48 10.48a1.55 1.55 0 0 0 2.19 0l10.424-10.425a1.55 1.55 0 0 0 0-2.193Z"/>
          </svg>
        </span>
        <a href="https://github.com/xd-dash" target="_blank" rel="noopener noreferrer">github.com/xd-dash</a>
      </div>

      <div class="footer-meta" data-worker-meta aria-live="polite">cloudflare worker · dashxd-com</div>
      <div class="footer-legal">© 2026 dash xd · all rights reserved</div>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
